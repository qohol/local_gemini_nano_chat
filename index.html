<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Gemini Nano Chat (Hardened Edition)</title>
  <!-- Content Security Policy: 外部スクリプトや外部通信を遮断 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <style>
    :root {
      --bg-base: #1e222b;
      --bg-surface: #282c37;
      --bg-input: #1a1d24;
      --bg-sidebar: #171a21;
      --border-color: #3b4252;
      --text-main: #e6edf3;
      --text-muted: #9aa4b2;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --ai-bubble: #282c37;
      --user-bubble: #2563eb;
      --btn-sub: #374151;
      --btn-sub-hover: #4b5563;
      --danger: #ef4444;
      --ok: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Noto Sans JP", sans-serif;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-base);
      color: var(--text-main);
      overflow: hidden;
    }

    body { height: 100vh; }

    #app {
      display: flex;
      height: 100%;
    }

    #sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      min-height: 0;
      z-index: 30;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      box-shadow: 0 0 8px rgba(96, 165, 250, 0.7);
    }

    .new-thread-btn {
      margin: 0 12px 10px;
      padding: 10px 12px;
      background: var(--accent);
      font-size: 13px;
      border-radius: 8px;
    }

    .new-thread-btn:hover:not(:disabled) { background: var(--accent-hover); }

    .thread-search { padding: 0 12px 10px; }

    .thread-search input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    .thread-search input:focus { border-color: var(--accent); }

    .thread-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 0;
    }

    .thread-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }

    .thread-item:hover { background: rgba(255, 255, 255, 0.05); }

    .thread-item.active {
      background: rgba(59, 130, 246, 0.16);
      border-color: rgba(59, 130, 246, 0.45);
    }

    .thread-item-main {
      flex: 1;
      min-width: 0;
    }

    .thread-item-title {
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-item-preview {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .thread-del {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1;
      padding: 3px 5px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }

    .thread-item:hover .thread-del { opacity: 1; }
    .thread-del:hover { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

    .sidebar-foot {
      border-top: 1px solid var(--border-color);
      padding: 10px 12px;
    }

    .sidebar-foot button {
      width: 100%;
      padding: 8px;
      font-size: 12px;
      font-weight: 500;
    }

    .thread-empty {
      color: var(--text-muted);
      font-size: 11.5px;
      padding: 12px 8px;
      text-align: center;
    }

    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 20;
    }

    #sidebarOverlay.show { display: block; }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 16px 16px;
      min-width: 0;
      min-height: 0;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 2px 10px;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .title-wrap { flex: 1; min-width: 0; }

    .title-wrap h1 {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions { display: flex; gap: 6px; }

    .icon-btn {
      background: var(--btn-sub);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 7px;
      font-size: 14px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-btn:hover:not(:disabled) { background: var(--btn-sub-hover); }

    #menuBtn { display: none; }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 14px;
      margin: 0 auto 12px;
      max-width: 880px;
      width: 100%;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      min-height: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    #chat-box::-webkit-scrollbar { width: 9px; }
    #chat-box::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 9px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
      max-width: 460px;
    }

    .empty-icon {
      font-size: 34px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .empty-state h2 {
      font-size: 17px;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .empty-state p { font-size: 12.5px; line-height: 1.7; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }

    .suggestion {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 16px;
    }

    .suggestion:hover:not(:disabled) { background: var(--btn-sub-hover); }

    .msg-row {
      display: flex;
      width: 100%;
      flex-shrink: 0;
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg-bubble {
      max-width: 85%;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      overflow-wrap: break-word;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .user .msg-bubble {
      background: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .ai .msg-bubble {
      background: var(--ai-bubble);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    .bubble-actions {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 6px;
      margin-top: 2px;
    }

    .bubble-copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .user .bubble-copy-btn { color: rgba(255, 255, 255, 0.8); }

    .bubble-copy-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .bubble-copy-btn.copied { color: var(--ok); }

    .msg-content { min-width: 0; }
    .msg-content p { margin-bottom: 8px; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content ul, .msg-content ol { margin-left: 20px; margin-bottom: 8px; }
    .msg-content li { margin-bottom: 4px; }
    .msg-content strong { color: #93c5fd; font-weight: 600; }
    .msg-content a { color: #93c5fd; }
    .msg-content pre {
      background: rgba(0, 0, 0, 0.45);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
      font-family: "Consolas", "Cascadia Mono", monospace;
      font-size: 0.9em;
      white-space: pre-wrap;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 11px 14px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
      min-height: 44px;
      max-height: 168px;
      overflow-y: auto;
    }

    textarea:focus { border-color: var(--accent); }
    textarea:disabled { opacity: 0.6; }

    button {
      padding: 0 16px;
      background: var(--accent);
      border: none;
      color: #fff;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) { background: var(--accent-hover); }

    .input-row button { height: 44px; }

    .btn-secondary {
      background: var(--btn-sub);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover:not(:disabled) { background: var(--btn-sub-hover); }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #sendBtn.btn-stop { background: var(--danger); }
    #sendBtn.btn-stop:hover:not(:disabled) { background: #dc2626; }

    #downloadBtn {
      background: var(--ok);
      padding: 12px;
      font-size: 14px;
      width: 100%;
      display: none;
      height: auto;
    }
    #downloadBtn:hover:not(:disabled) { background: #059669; }

    .status-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 2px;
      min-height: 16px;
    }

    #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #usage { flex-shrink: 0; font-variant-numeric: tabular-nums; }

    dialog {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0;
      width: min(520px, calc(100vw - 32px));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    dialog::backdrop { background: rgba(0, 0, 0, 0.6); }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
    }

    .dialog-head h2 { font-size: 14px; }

    .dialog-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 65vh;
      overflow-y: auto;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    .field label { font-size: 12px; font-weight: 600; color: var(--text-main); }

    .field .hint { font-size: 11px; color: var(--text-muted); }

    .field textarea {
      min-height: 90px;
      max-height: 220px;
      font-size: 12.5px;
    }

    .field input[type="range"] { width: 100%; accent-color: var(--accent); }

    .dialog-foot {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .dialog-foot .spacer { flex: 1; }

    .dialog-foot button { height: 36px; font-size: 12.5px; padding: 0 14px; }

    .danger-btn {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.6);
      color: #fca5a5;
      font-weight: 500;
    }

    .danger-btn:hover:not(:disabled) { background: rgba(239, 68, 68, 0.15); }

    @media (max-width: 860px) {
      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        box-shadow: 12px 0 30px rgba(0, 0, 0, 0.5);
      }
      #sidebar.open { transform: translateX(0); }
      #menuBtn { display: inline-flex; }
      #main { padding: 10px 10px 12px; }
      .msg-bubble { max-width: 92%; }
    }
  </style>
</head>
<body>

  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-dot"></span>
        <span>Gemini Nano Chat</span>
      </div>
      <button id="newThreadBtn" class="new-thread-btn">＋ 新しいスレッド</button>
      <div class="thread-search">
        <input type="text" id="threadSearch" placeholder="🔍 スレッドを検索" />
      </div>
      <div id="threadList" class="thread-list"></div>
      <div class="sidebar-foot">
        <button id="settingsBtn" class="btn-secondary">⚙ 設定</button>
      </div>
    </aside>
    <div id="sidebarOverlay"></div>

    <main id="main">
      <header class="chat-header">
        <button id="menuBtn" class="icon-btn" title="スレッド一覧を開く">☰</button>
        <div class="title-wrap">
          <h1 id="threadTitle">…</h1>
          <div id="threadMeta" class="thread-meta"></div>
        </div>
        <div class="header-actions">
          <button id="exportBtn" class="icon-btn" title="Markdown形式でエクスポート">⤓</button>
          <button id="renameBtn" class="icon-btn" title="スレッド名を変更">✎</button>
          <button id="clearBtn" class="icon-btn" title="このスレッドの履歴を削除">🗑</button>
        </div>
      </header>

      <div id="chat-box"></div>

      <div class="controls">
        <button id="downloadBtn">Gemini Nano モデルのダウンロード・準備を開始する</button>

        <div class="input-row">
          <textarea id="userInput" rows="1"
            placeholder="メッセージを入力... (Enterで送信 / Shift+Enterで改行)" disabled></textarea>
          <button id="copyInputBtn" class="btn-secondary" title="現在入力されているテキストをコピー">コピー</button>
          <button id="sendBtn" disabled>送信</button>
        </div>

        <div class="status-bar">
          <span id="status">初期化中...</span>
          <span id="usage"></span>
        </div>
      </div>
    </main>
  </div>

  <dialog id="settingsDialog">
    <div class="dialog-head">
      <h2>設定</h2>
      <button id="closeSettingsBtn" class="icon-btn" title="閉じる">×</button>
    </div>
    <div class="dialog-body">
      <div class="field">
        <label for="systemPromptInput">システムプロンプト</label>
        <textarea id="systemPromptInput" spellcheck="false"></textarea>
        <span class="hint">新しい応答から反映されます。</span>
      </div>
      <div class="field">
        <label for="temperatureInput">温度（創造性）: <span id="temperatureValue">0.8</span></label>
        <input type="range" id="temperatureInput" min="0" max="1" step="0.05" />
        <span class="hint">低いほど安定、高いほど多様な回答になります。</span>
      </div>
    </div>
    <div class="dialog-foot">
      <button id="exportAllBtn" class="btn-secondary">全履歴をJSON保存</button>
      <button id="deleteAllBtn" class="danger-btn">全スレッド削除</button>
      <span class="spacer"></span>
      <button id="saveSettingsBtn">保存して閉じる</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
